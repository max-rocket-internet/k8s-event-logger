image:
  containerName: app
  repository: maxrocketinternet/k8s-event-logger
  tag: "3.1"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

env: {}
args: []
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
nodeSelector: {}
tolerations: []
affinity: {}
podLabels: {}
podAnnotations: {}

metrics:
  # Serve Prometheus metrics on /metrics and create a Service for scraping them.
  enabled: false
  port: 8080
  service:
    # Added to the default prometheus.io/scrape and prometheus.io/port annotations; values set here take precedence.
    annotations: {}

securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
